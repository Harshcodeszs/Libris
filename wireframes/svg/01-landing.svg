<rect x="0" y="0" width="1440" height="900" fill="#FAF7F1"/>
<g id="screen-01-landing" clip-path="url(#clip-01-landing)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FAF7F1"/><circle cx="1180" cy="90" r="300" fill="#DFEDE2" opacity="0.55"/><circle cx="1340" cy="160" r="200" fill="#F7EDCB" opacity="0.5"/><circle cx="120" cy="760" r="260" fill="#F3EDE2" opacity="0.6"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FAF7F1"/><line x1="0" y1="80" x2="1440" y2="80" stroke="#E8DECB" stroke-width="1"/><rect x="40" y="22" width="36" height="36" rx="12" fill="#204531"/><g transform="translate(49 31) scale(0.75)" fill="none" stroke="#FDFCF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g><text x="86" y="38" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#1C1917" text-anchor="start">Libris</text><text x="86" y="52" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.35">LIBRARY BORROWING SYSTEM</text><text x="760" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">Catalog</text><text x="841" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">How it works</text><text x="957" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">Borrowing rules</text><rect x="1176" y="20" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="1197.54" y="44.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#44403C" text-anchor="start">Sign in</text><rect x="1284" y="20" width="124" height="40" rx="10" fill="#204531"/><text x="1293.08" y="44.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Create account</text><text x="40" y="168" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8B5118" text-anchor="start" letter-spacing="2">LIBRIS COLLEGE LIBRARY</text><text x="40" y="240" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#1C1917" text-anchor="start">Every book,</text><text x="40" y="302" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#26553A" text-anchor="start" font-style="italic">accounted for.</text><text x="40" y="350" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#57534E" text-anchor="start">Request a title, get it approved at the desk, and keep every due</text><text x="40" y="373" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#57534E" text-anchor="start">date in sight. One calm place for borrowing, returns, and fines.</text><rect x="40" y="438" width="196" height="48" rx="10" fill="#204531"/><g transform="translate(57.959999999999994 454) scale(0.6666666666666666)" fill="none" stroke="#FDFCF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01"/><path d="M15 10h.01"/></g><text x="81.96" y="466.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Browse the catalog</text><rect x="248" y="438" width="196" height="48" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="274.18" y="466.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#44403C" text-anchor="start">How borrowing works</text><text x="40" y="546" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1C1917" text-anchor="start">14 days</text><text x="40" y="568" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#78716C" text-anchor="start">Standard loan period</text><text x="256" y="546" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1C1917" text-anchor="start">5 books</text><text x="256" y="568" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#78716C" text-anchor="start">Maximum per student</text><line x1="232" y1="522" x2="232" y2="566" stroke="#E8DECB" stroke-width="1"/><text x="472" y="546" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#1C1917" text-anchor="start">₱5 / day</text><text x="472" y="568" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#78716C" text-anchor="start">Overdue fine rate</text><line x1="448" y1="522" x2="448" y2="566" stroke="#E8DECB" stroke-width="1"/><rect x="744" y="120" width="656" height="468" rx="24" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="744" y="120" width="656" height="44" rx="24" fill="#FDFCF9"/><rect x="744" y="150" width="656" height="14" rx="0" fill="#FDFCF9"/><circle cx="768" cy="142" r="5" fill="#D9A83A"/><text x="784" y="147" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#44403C" text-anchor="start">This week on the shelf</text><rect x="1284" y="128" width="72" height="22" rx="11" fill="#F1F7F2" stroke="#C0DBC7" stroke-width="1"/><text x="1320" y="143" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#26553A" text-anchor="middle">24 copies</text><rect x="788" y="190" width="126" height="190" rx="6" fill="#0D2118"/><rect x="788" y="190" width="126" height="110" rx="6" fill="#26553A"/><rect x="788" y="294" width="126" height="6" rx="0" fill="#26553A"/><rect x="788" y="190" width="5" height="190" rx="3" fill="#000000" opacity="0.18"/><text x="798" y="206" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.4" font-weight="700" fill="#FAF7F1" text-anchor="start" letter-spacing="0.6" opacity="0.75">FICTION</text><text x="798" y="224" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700" fill="#FDFCF9" text-anchor="start">The Great Gatsby</text><text x="798" y="368" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.2" font-weight="400" fill="#FAF7F1" text-anchor="start" opacity="0.7">Fitzgerald</text><line x1="798" y1="360" x2="904" y2="360" stroke="#FAF7F1" stroke-width="1" opacity="0.25"/><rect x="936" y="190" width="126" height="190" rx="6" fill="#1C1917"/><rect x="936" y="190" width="126" height="110" rx="6" fill="#78716C"/><rect x="936" y="294" width="126" height="6" rx="0" fill="#78716C"/><rect x="936" y="190" width="5" height="190" rx="3" fill="#000000" opacity="0.18"/><text x="946" y="206" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.4" font-weight="700" fill="#FAF7F1" text-anchor="start" letter-spacing="0.6" opacity="0.75">HISTORY</text><text x="946" y="224" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700" fill="#FDFCF9" text-anchor="start">Sapiens</text><text x="946" y="368" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.2" font-weight="400" fill="#FAF7F1" text-anchor="start" opacity="0.7">Harari</text><line x1="946" y1="360" x2="1052" y2="360" stroke="#FAF7F1" stroke-width="1" opacity="0.25"/><rect x="1084" y="190" width="126" height="190" rx="6" fill="#0F172A"/><rect x="1084" y="190" width="126" height="110" rx="6" fill="#0369A1"/><rect x="1084" y="294" width="126" height="6" rx="0" fill="#0369A1"/><rect x="1084" y="190" width="5" height="190" rx="3" fill="#000000" opacity="0.18"/><text x="1094" y="206" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.4" font-weight="700" fill="#FAF7F1" text-anchor="start" letter-spacing="0.6" opacity="0.75">TECHNOLOGY</text><text x="1094" y="224" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700" fill="#FDFCF9" text-anchor="start">Clean Code</text><text x="1094" y="368" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.2" font-weight="400" fill="#FAF7F1" text-anchor="start" opacity="0.7">Martin</text><line x1="1094" y1="360" x2="1200" y2="360" stroke="#FAF7F1" stroke-width="1" opacity="0.25"/><rect x="1232" y="190" width="126" height="190" rx="6" fill="#613819"/><rect x="1232" y="190" width="126" height="110" rx="6" fill="#C98C25"/><rect x="1232" y="294" width="126" height="6" rx="0" fill="#C98C25"/><rect x="1232" y="190" width="5" height="190" rx="3" fill="#000000" opacity="0.18"/><text x="1242" y="206" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.4" font-weight="700" fill="#FAF7F1" text-anchor="start" letter-spacing="0.6" opacity="0.75">SELF-HELP</text><text x="1242" y="224" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700" fill="#FDFCF9" text-anchor="start">Atomic Habits</text><text x="1242" y="368" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="6.2" font-weight="400" fill="#FAF7F1" text-anchor="start" opacity="0.7">Clear</text><line x1="1242" y1="360" x2="1348" y2="360" stroke="#FAF7F1" stroke-width="1" opacity="0.25"/><rect x="776" y="418" width="600" height="128" rx="16" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><circle cx="820" cy="482" r="22" fill="#DFEDE2"/><g transform="translate(808 470) scale(1)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12 3 3 5-6"/></g><text x="858" y="466" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1C1917" text-anchor="start">Atomic Habits was just approved</text><text x="858" y="486" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">Due November 19 · Juan Dela Cruz</text><rect x="1280" y="462" width="60" height="22" rx="11" fill="#F1F7F2" stroke="#C0DBC7" stroke-width="1"/><text x="1310" y="477" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#26553A" text-anchor="middle">On loan</text><rect x="1255" y="494" width="85" height="22" rx="11" fill="#FAF7F1" stroke="#E8DECB" stroke-width="1"/><text x="1297.5" y="509" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#57534E" text-anchor="middle">14-day loan</text><text x="744" y="628" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start" font-style="italic">Built around the desk, not around the paperwork.</text><rect x="40" y="660" width="442" height="150" rx="20" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="64" y="684" width="40" height="40" rx="11" fill="#F1F7F2"/><g transform="translate(75 695) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g><text x="64" y="754" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#1C1917" text-anchor="start">Request in seconds</text><text x="64" y="776" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">Students ask for a copy online. The shelf stays accurate</text><text x="64" y="793" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">while the desk reviews.</text><rect x="506" y="660" width="442" height="150" rx="20" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="530" y="684" width="40" height="40" rx="11" fill="#F1F7F2"/><g transform="translate(541 695) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12 3 3 5-6"/></g><text x="530" y="754" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#1C1917" text-anchor="start">Approve with confidence</text><text x="530" y="776" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">One click issues the loan, starts the 14-day clock and</text><text x="530" y="793" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">records who approved it.</text><rect x="972" y="660" width="442" height="150" rx="20" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="996" y="684" width="40" height="40" rx="11" fill="#F1F7F2"/><g transform="translate(1007 695) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></g><text x="996" y="754" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#1C1917" text-anchor="start">Fines without friction</text><text x="996" y="776" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">Overdue charges calculate themselves. Pay, waive or</text><text x="996" y="793" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="start">issue a manual fine in one place.</text><line x1="40" y1="844" x2="1400" y2="844" stroke="#E8DECB" stroke-width="1"/><text x="40" y="870" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#78716C" text-anchor="start">© 2026 Libris College Library</text><text x="1400" y="870" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#78716C" text-anchor="end">Mon–Sat, 8:00–17:00 · library@libris.edu.ph · (02) 8123 4567</text>
</g>
