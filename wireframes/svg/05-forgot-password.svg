<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-05-forgot-password desc-05-forgot-password">
<title id="title-05-forgot-password">Libris — Forgot password</title>
<desc id="desc-05-forgot-password">Sends a simulated reset link to the demo mailbox.</desc>
<defs><clipPath id="clip-05-forgot-password"><rect x="0" y="0" width="1440" height="900"/></clipPath></defs>
<rect x="0" y="0" width="1440" height="900" fill="#FAF7F1"/>
<g id="screen-05-forgot-password" clip-path="url(#clip-05-forgot-password)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FAF7F1"/><circle cx="1180" cy="90" r="300" fill="#DFEDE2" opacity="0.55"/><circle cx="1340" cy="160" r="200" fill="#F7EDCB" opacity="0.5"/><circle cx="120" cy="760" r="260" fill="#F3EDE2" opacity="0.6"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FAF7F1"/><line x1="0" y1="80" x2="1440" y2="80" stroke="#E8DECB" stroke-width="1"/><rect x="40" y="22" width="36" height="36" rx="12" fill="#204531"/><g transform="translate(49 31) scale(0.75)" fill="none" stroke="#FDFCF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g><text x="86" y="38" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#1C1917" text-anchor="start">Libris</text><text x="86" y="52" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.35">LIBRARY BORROWING SYSTEM</text><text x="760" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">Catalog</text><text x="841" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">How it works</text><text x="957" y="47" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#57534E" text-anchor="start">Borrowing rules</text><rect x="1176" y="20" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="1197.54" y="44.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#44403C" text-anchor="start">Sign in</text><rect x="1284" y="20" width="124" height="40" rx="10" fill="#204531"/><text x="1293.08" y="44.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Create account</text><rect x="200" y="168" width="520" height="470" rx="24" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="236" y="204" width="40" height="40" rx="12" fill="#FCF8EC"/><g transform="translate(247 215) scale(0.75)" fill="none" stroke="#8B5118" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3"/></g><text x="236" y="282" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#1C1917" text-anchor="start">Forgot your password?</text><text x="236" y="308" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534E" text-anchor="start">Enter the email on your account. We will send a reset link</text><text x="236" y="326" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57534E" text-anchor="start">to the Demo Mailbox.</text><text x="236" y="362" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">Email address</text><rect x="236" y="372" width="448" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(249 385) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></g><text x="274" y="398" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">juan.delacruz@gmail.com</text><rect x="236" y="438" width="448" height="44" rx="10" fill="#204531"/><text x="403.3" y="464.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Send reset link</text><g transform="translate(648 453) scale(0.7083333333333334)" fill="none" stroke="#FDFCF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g><line x1="236" y1="512" x2="684" y2="512" stroke="#F3EDE2" stroke-width="1"/><g transform="translate(236 532) scale(0.625)" fill="none" stroke="#57534E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></g><text x="260" y="544" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#26553A" text-anchor="start">Back to sign in</text><text x="684" y="544" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#78716C" text-anchor="end">Need an account? Register</text><text x="460" y="600" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#78716C" text-anchor="middle">For security, reset links expire after 60 minutes.</text><rect x="796" y="140" width="484" height="520" rx="20" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="796" y="140" width="484" height="54" rx="20" fill="#0D2118"/><rect x="796" y="174" width="484" height="20" rx="0" fill="#0D2118"/><g transform="translate(814 157) scale(0.7083333333333334)" fill="none" stroke="#E4BF5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g><text x="838" y="170" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FDFCF9" text-anchor="start">Demo Mailbox</text><rect x="1210" y="156" width="48" height="22" rx="11" fill="#AE6D1C" stroke="#AE6D1C" stroke-width="1"/><text x="1234" y="171" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1 new</text><text x="820" y="228" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.3">LIBRIS COLLEGE LIBRARY</text><text x="820" y="258" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#1C1917" text-anchor="start">Reset your Libris password</text><text x="820" y="278" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">to juan.delacruz@gmail.com · just now</text><line x1="820" y1="296" x2="1256" y2="296" stroke="#F3EDE2" stroke-width="1"/><text x="820" y="324" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">We received a request to reset the password for your reader</text><text x="820" y="342" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">account. Use the button below to choose a new one.</text><rect x="820" y="388" width="436" height="42" rx="10" fill="#204531"/><text x="958.62" y="413.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Choose a new password</text><text x="820" y="462" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">If you did not request this, you can ignore the email. Your password will not change.</text><rect x="820" y="494" width="436" height="80" rx="12" fill="#FCF8EC" stroke="#F7EDCB" stroke-width="1"/><g transform="translate(836 510) scale(0.6666666666666666)" fill="none" stroke="#8B5118" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4"/><path d="M12 8h.01"/></g><text x="860" y="522" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#613819" text-anchor="start">Demo mode: this link is simulated and appears</text><text x="860" y="537" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#613819" text-anchor="start">only in the on-screen mailbox.</text><text x="820" y="612" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#78716C" text-anchor="start">Libris College Library · demo build</text>
</g>
</svg>
