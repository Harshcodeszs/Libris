<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title-21-change-password desc-21-change-password">
<title id="title-21-change-password">Libris — First sign-in password change</title>
<desc id="desc-21-change-password">Mandatory password update after a librarian receives a temporary credential.</desc>
<defs><clipPath id="clip-21-change-password"><rect x="0" y="0" width="1440" height="900"/></clipPath></defs>
<rect x="0" y="0" width="1440" height="900" fill="#FAF7F1"/>
<g id="screen-21-change-password" clip-path="url(#clip-21-change-password)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FAF7F1"/><circle cx="1180" cy="120" r="320" fill="#DFEDE2" opacity="0.5"/><circle cx="140" cy="780" r="240" fill="#F7EDCB" opacity="0.4"/><rect x="40" y="26" width="36" height="36" rx="12" fill="#204531"/><g transform="translate(49 35) scale(0.75)" fill="none" stroke="#FDFCF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g><text x="86" y="42" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" fill="#1C1917" text-anchor="start">Libris</text><text x="86" y="56" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.35">LIBRARY BORROWING SYSTEM</text><text x="40" y="122" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8B5118" text-anchor="start" letter-spacing="1.8">ACCOUNT SETUP</text><text x="40" y="172" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#1C1917" text-anchor="start">One last step</text><text x="40" y="204" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#26553A" text-anchor="start" font-style="italic">before you open the desk.</text><text x="40" y="244" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#57534E" text-anchor="start">Your account was created with a temporary password.</text><text x="40" y="265" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#57534E" text-anchor="start">Choose a private one now — you will use it every</text><text x="40" y="286" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#57534E" text-anchor="start">time you sign in.</text><circle cx="56" cy="342" r="16" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(47 333) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g><text x="84" y="347" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">Only you will know the new password</text><circle cx="56" cy="394" r="16" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(47 385) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3"/></g><text x="84" y="399" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">Temporary passwords stop working after this step</text><circle cx="56" cy="446" r="16" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(47 437) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></g><text x="84" y="451" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">It takes less than a minute</text><rect x="40" y="520" width="440" height="116" rx="16" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><circle cx="79" cy="561" r="19" fill="#F7EDCB"/><text x="79" y="568.22" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.68" font-weight="700" fill="#613819" text-anchor="middle">DC</text><text x="112" y="558" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">Daniel Cruz</text><text x="112" y="574" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">daniel.cruz@library.test</text><rect x="112" y="584" width="169" height="22" rx="11" fill="#FCF8EC" stroke="#EFD997" stroke-width="1"/><text x="196.5" y="599" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#734218" text-anchor="middle">Librarian · setup pending</text><text x="60" y="618" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="400" fill="#78716C" text-anchor="start">Signing in from Libris College Library · Chrome on Windows</text><line x1="40" y1="842" x2="1400" y2="842" stroke="#E8DECB" stroke-width="1"/><text x="40" y="868" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#78716C" text-anchor="start">© 2026 Libris College Library</text><text x="1400" y="868" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#78716C" text-anchor="end">Mon–Sat, 8:00–17:00 · library@libris.edu.ph · (02) 8123 4567</text><rect x="680" y="112" width="620" height="668" rx="24" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><rect x="716" y="148" width="44" height="44" rx="12" fill="#F1F7F2"/><g transform="translate(728 160) scale(0.8333333333333334)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="716" y="230" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#1C1917" text-anchor="start">Set a new password</text><text x="716" y="254" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="start">You will use this password from now on.</text><rect x="716" y="278" width="548" height="40" rx="10" fill="#FCF8EC" stroke="#EFD997" stroke-width="1"/><g transform="translate(730 290) scale(0.6666666666666666)" fill="none" stroke="#8B5118" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="754" y="303" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#613819" text-anchor="start">First sign-in detected — a new password is required.</text><text x="716" y="344" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">Current temporary password</text><rect x="716" y="354" width="548" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(729 367) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="754" y="380" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">••••••••••</text><text x="716" y="424" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">New password</text><rect x="716" y="434" width="548" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(729 447) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="754" y="460" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">••••••••••</text><g transform="translate(1210 464) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></g><text x="716" y="504" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">Confirm new password</text><rect x="716" y="514" width="548" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(729 527) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="754" y="540" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">••••••••••</text><g transform="translate(1210 544) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></g><text x="716" y="578" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.2">PASSWORD STRENGTH</text><rect x="716" y="588" width="128" height="6" rx="3" fill="#2E6A47"/><rect x="855" y="588" width="128" height="6" rx="3" fill="#2E6A47"/><rect x="994" y="588" width="128" height="6" rx="3" fill="#2E6A47"/><rect x="1133" y="588" width="128" height="6" rx="3" fill="#E8DECB"/><text x="1264" y="594" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#26553A" text-anchor="end">Strong</text><g transform="translate(716 615) scale(0.5833333333333334)" fill="none" stroke="#2E6A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g><text x="738" y="626" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#44403C" text-anchor="start">At least 8 characters</text><g transform="translate(716 637) scale(0.5833333333333334)" fill="none" stroke="#2E6A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g><text x="738" y="648" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#44403C" text-anchor="start">One uppercase letter and one number</text><g transform="translate(716 659) scale(0.5833333333333334)" fill="none" stroke="#2E6A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g><text x="738" y="670" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#44403C" text-anchor="start">Different from the temporary password</text><g transform="translate(716 681) scale(0.5833333333333334)" fill="none" stroke="#78716C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g><text x="738" y="692" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#78716C" text-anchor="start">Not used on another account</text><rect x="716" y="722" width="548" height="46" rx="10" fill="#204531"/><text x="899.28" y="749.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Save password &amp; continue</text><g transform="translate(1206 737) scale(0.7083333333333334)" fill="none" stroke="#FDFCF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g><text x="990" y="792" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#78716C" text-anchor="middle">Need help? Ask the superlibrarian.</text>
</g>
