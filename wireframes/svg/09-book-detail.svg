t" letter-spacing="1.5">SELF-HELP</text><text x="360" y="100" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="36" font-weight="600" fill="#1C1917" text-anchor="start">Atomic Habits</text><text x="360" y="128" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#57534E" text-anchor="start">by James Clear</text><rect x="360" y="146" width="72" height="22" rx="11" fill="#F1F7F2" stroke="#C0DBC7" stroke-width="1"/><text x="396" y="161" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#26553A" text-anchor="middle">Available</text><rect x="432" y="146" width="54" height="22" rx="11" fill="#FAF7F1" stroke="#E8DECB" stroke-width="1"/><text x="459" y="161" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#57534E" text-anchor="middle">1 copy</text><text x="360" y="194" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#44403C" text-anchor="start">A practical guide to building good habits and breaking bad ones. Small</text><text x="360" y="215" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#44403C" text-anchor="start">changes, repeated consistently, compound into remarkable results.</text><rect x="360" y="262" width="178" height="64" rx="10" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><text x="372" y="282" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1">CATEGORY</text><text x="372" y="306" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">Self-Help</text><rect x="550" y="262" width="178" height="64" rx="10" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><text x="562" y="282" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1">LOAN PERIOD</text><text x="562" y="306" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">14 days</text><rect x="740" y="262" width="178" height="64" rx="10" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><text x="752" y="282" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1">SHELF</text><text x="752" y="306" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">F-04</text><rect x="930" y="262" width="178" height="64" rx="10" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><text x="942" y="282" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1">FINE RATE</text><text x="942" y="306" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1917" text-anchor="start">₱5 / late day</text><rect x="360" y="348" width="760" height="74" rx="12" fill="#F1F7F2" stroke="#C0DBC7" stroke-width="1"/><g transform="translate(378 366) scale(0.75)" fill="none" stroke="#26553A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12 3 3 5-6"/></g><text x="404" y="374" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1B3A2A" text-anchor="start">You are eligible to request this copy</text><text x="404" y="394" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#204531" text-anchor="start">No unpaid fines. You have 2 of 5 active loans and 1 pending request.</text><rect x="360" y="440" width="196" height="46" rx="10" fill="#204531"/><g transform="translate(381.74 455) scale(0.6666666666666666)" fill="none" stroke="#FDFCF9" stroke-width="1.8" stroke-li