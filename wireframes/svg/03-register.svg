="rgba(228,191,92,0.8)" text-anchor="start" letter-spacing="1.8">THREE STEPS TO YOUR</text><text x="784" y="236" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#FDFCF9" text-anchor="start">first checked-out book</text><circle cx="804" cy="310" r="18" fill="rgba(255,255,255,0.08)" stroke="#D9A83A" stroke-width="1"/><text x="804" y="315" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#E4BF5C" text-anchor="middle">01</text><text x="840" y="310" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#FDFCF9" text-anchor="start">Create the account</text><text x="840" y="332" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="rgba(250,247,241,0.6)" text-anchor="start">Register with your Gmail address and student</text><text x="840" y="349" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="rgba(250,247,241,0.6)" text-anchor="start">details.</text><line x1="804" y1="338" x2="804" y2="394" stroke="rgba(228,191,92,0.35)" stroke-width="1" stroke-dasharray="3 4"/><circle cx="804" cy="418" r="18" fill="rgba(255,255,255,0.08)" stroke="#D9A83A" stroke-width="1"/><text x="804" y="423" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#E4BF5C" text-anchor="middle">02</text><text x="840" y="418" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#FDFCF9" text-anchor="start">Confirm the email</text><text x="840" y="440" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="rgba(250,247,241,0.6)" text-anchor="start">Open the simulated link in the Demo Mailbox.</text><line x1="804" y1="446" x2="804" y2="502" stroke="rgba(228,191,92,0.35)" stroke-width="1" stroke-dasharray="3 4"/><circle cx="804" cy="526" r="18" fill="rgba(255,255,255,0.08)" 