"600" fill="#FDFCF9" text-anchor="start">Create account</text><rect x="40" y="112" width="664" height="690" rx="24" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="76" y="166" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#1C1917" text-anchor="start">Create your reader account</text><text x="76" y="190" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="start">Students only. Use a Gmail address so we can send the confirmation link.</text><text x="76" y="224" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">First name</text><rect x="76" y="234" width="292" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="90" y="260" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">Juan</text><text x="388" y="224" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">Last name</text><rect x="388" y="234" width="292" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><text x="402" y="260" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1C1917" text-anchor="start">Dela Cruz</text><text x="76" y="304" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#44403C" text-anchor="start">Gmail address</text><rect x="76" y="314" width="604" height="42" rx="10" fill="#FFFFFF" stroke="#E8DECB" stroke-width="1"/><g transform="translate(89 327) scale(0.6666666666666666)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></g><text x="114" y="340" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" 