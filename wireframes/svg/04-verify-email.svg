e="10.5" font-weight="400" fill="#57534E" text-anchor="start">Confirm your reader account</text><text x="1248" y="234" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#78716C" text-anchor="end">now</text><line x1="792" y1="304" x2="1264" y2="304" stroke="#F3EDE2" stroke-width="1"/><text x="800" y="332" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#1C1917" text-anchor="start">Confirm your reader account</text><text x="800" y="352" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">Libris College Library · to juan.delacruz@gmail.com</text><line x1="792" y1="368" x2="1264" y2="368" stroke="#F3EDE2" stroke-width="1"/><text x="800" y="398" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">Welcome to Libris, Juan. Confirm your email address to activate</text><text x="800" y="417" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#44403C" text-anchor="start">your reader account and start requesting books.</text><rect x="800" y="470" width="464" height="128" rx="14" fill="#FDFCF9" stroke="#F3EDE2" stroke-width="1"/><text x="822" y="498" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#78716C" text-anchor="start" letter-spacing="1.3">YOUR READER ACCOUNT</text><text x="822" y="522" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">Juan Dela Cruz</text><text x="822" y="542" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#57534E" text-anchor="start">juan.delacruz@gmail.com</text><rect x="1180" y="508" width="60" height="22" rx="11" fill="#F1F7F2" stroke="#C0DBC7" stroke-width="1"/><text x="1210" y="523" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#26553A" text-anchor="middle">Student</text><text x="822" y="578" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">14-day loans · 5-book limit</text><rect x="800" y="622" width="464" height="44" rx="10" fill="#204531"/><g transform="translate(940.62 636) scale(0.6666666666666666)" fill="none" stroke="#FDFCF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g><text x="964.62" y="648.86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FDFCF9" text-anchor="start">Confirm email address</text><text x="800" y="690" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#78716C" text-anchor="start">This is a simulated email. No real message is sent.</text><line x1="160" y1="740" x2="680" y2="740" stroke="#F3EDE2" stroke-width="1"/><g transform="translate(160 756) scale(0.5833333333333334)" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4"/><path d="M12 8h.01"/></g><text x="180" y="768" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#78716C" text-anchor="start">Confirmation links expire after 24 hours. The mailbox is available on every public page.</text>
